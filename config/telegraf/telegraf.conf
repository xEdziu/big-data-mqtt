[agent]
  interval = "10s"
  flush_interval = "1s"
  metric_batch_size = 1000
  # Bufor Telegrafa - kolejna warstwa store-and-forward, gdy InfluxDB jest niedostępny
  metric_buffer_limit = 100000
  omit_hostname = true
  skip_processors_after_aggregators = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["mine/+/+/telemetry"]
  # QoS 1 + trwała sesja: broker przechowa wiadomości, gdy Telegraf leży
  qos = 1
  persistent_session = true
  client_id = "telegraf-ingest"
  max_reconnect_interval = "10s"
  max_undelivered_messages = 5000
  topic_tag = ""

  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  json_string_fields = ["link", "faults"]

  # mine/<machine_type>/<device_id>/telemetry -> measurement=<machine_type>, tag device_id
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "mine/+/+/telemetry"
    measurement = "_/measurement/_/_"
    tags = "_/_/device_id/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
