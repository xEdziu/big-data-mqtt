apiVersion: 1

groups:
  - orgId: 1
    name: bezpieczenstwo
    folder: Kopalnia
    interval: 10s
    rules:
      - uid: ch4-above-1pct
        title: Metan CH4 > 1%
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        dashboardUid: kopalnia-telemetria
        panelId: 10
        annotations:
          summary: "Przekroczone stężenie metanu na {{ $labels.device_id }}: {{ $values.B.Value }}%"
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: influxdb
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              query: |-
                from(bucket: "telemetry")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._field == "ch4_pct")
                  |> aggregateWindow(every: 10s, fn: max, createEmpty: false)
                  |> keep(columns: ["_time", "_value", "_measurement", "device_id"])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [1]}
              datasource: {type: __expr__, uid: __expr__}
