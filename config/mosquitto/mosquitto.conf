# Trwała sesja Telegrafa (QoS 1) przetrwa restart brokera
persistence true
persistence_location /mosquitto/data/
# Domyślnie 1000 - za mało, gdyby Telegraf był chwilę niedostępny przy backfillu
max_queued_messages 100000

# MQTT dla urządzeń i Telegrafa
listener 1883
# MQTT over WebSockets dla panelu dyspozytora w przeglądarce
listener 9001
protocol websockets

# Środowisko demonstracyjne - bez uwierzytelniania (Mosquitto 2.x wymaga jawnej zgody)
allow_anonymous true
