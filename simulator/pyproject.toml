[project]
name = "edge-sim"
version = "0.1.0"
description = "Symulator urządzeń brzegowych (maszyny górnicze) z buforem store-and-forward"
requires-python = ">=3.12"
dependencies = ["paho-mqtt==2.1.0"]

[project.scripts]
edge-sim = "edge_sim.__main__:main"

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
